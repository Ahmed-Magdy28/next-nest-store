[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @repo/database build && pnpm --filter @repo/shared build && pnpm --filter backend build"

[deploy]
startCommand = "pnpm --filter @repo/database migrate:deploy && pnpm --filter backend start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
