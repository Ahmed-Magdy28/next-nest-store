services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    container_name: next-nest-store-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DATABASE_TEST_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_TEST}?schema=public&connection_limit=1
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}

    ports:
      - "${PORT:-3000}:${PORT:-3000}"

    command: sh -c "pnpm --filter @repo/database migrate:deploy && pnpm --filter backend start:dev"

  postgres:
    image: postgres:17

    container_name: next-nest-store-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_DB_TEST: ${POSTGRES_DB_TEST}

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  postgres-data:
