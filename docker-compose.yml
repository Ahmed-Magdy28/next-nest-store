services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    container_name: next-nest-store-backend

    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    environment:
      NODE_ENV: development
      CI: "true"
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000,http://localhost:3000}

    ports:
      - "${PORT:-3000}:${PORT:-3000}"

    volumes:
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/database/src:/app/packages/database/src
      - ./packages/database/prisma:/app/packages/database/prisma
      - ./packages/database/tsconfig.json:/app/packages/database/tsconfig.json

    command: sh -c 'export DATABASE_URL=$(echo "$DATABASE_URL" | sed -E "s/@(localhost|127\\.0\\.0\\.1):/@host.docker.internal:/") &&
      export DATABASE_TEST_URL=$(echo "$DATABASE_TEST_URL" | sed -E "s/@(localhost|127\\.0\\.0\\.1):/@host.docker.internal:/") &&
      pnpm --filter @repo/database build &&
      pnpm --filter @repo/database migrate:deploy &&
      pnpm --filter @repo/shared build &&
      pnpm --filter backend build &&
      pnpm --filter backend dev'

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile

    container_name: next-nest-store-frontend

    restart: unless-stopped

    depends_on:
      - backend

    env_file:
      - .env

    environment:
      NODE_ENV: development
      CI: "true"
      PORT: ${FRONTEND_PORT:-4000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}

    ports:
      - "${FRONTEND_PORT:-4000}:${FRONTEND_PORT:-4000}"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/frontend/node_modules
      - /app/apps/frontend/.next
      - /app/packages/ui/node_modules

    command: sh -c "pnpm --filter frontend dev"

  admin:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile

    container_name: next-nest-store-admin

    restart: unless-stopped

    depends_on:
      - backend

    env_file:
      - .env

    environment:
      NODE_ENV: development
      CI: "true"
      PORT: ${ADMIN_PORT:-4005}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      ADMIN_SITE_TITLE: ${ADMIN_SITE_TITLE:-Admin Dashboard}

    ports:
      - "${ADMIN_PORT:-4005}:${ADMIN_PORT:-4005}"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
      - /app/apps/admin/.next
      - /app/packages/ui/node_modules

    command: sh -c "pnpm --filter admin dev"
